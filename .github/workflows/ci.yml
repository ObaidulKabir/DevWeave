name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: devweave
          POSTGRES_USER: devweave
          POSTGRES_PASSWORD: change-me-locally
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U devweave -d devweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DevWeave.sln

      - name: Build
        run: dotnet build DevWeave.sln --no-restore --configuration Release

      - name: Test
        env:
          DEVWEAVE_TEST_DB_HOST: localhost
          DEVWEAVE_TEST_DB_PORT: '5433'
          DEVWEAVE_TEST_DB_USER: devweave
          DEVWEAVE_TEST_DB_PASSWORD: change-me-locally
        run: dotnet test DevWeave.sln --no-build --configuration Release --logger "trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/studio
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
  # ─── Deploy to Production ────────────────────────────────────────
  # Only on pushes to main — never on pull_request (avoids deploying feature branches).
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Update Code on Server
        uses: appleboy/ssh-action@b0a8f324e192469585a608d1f586061cf28a6571
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd  ${{ secrets.APP_PATH }}
            git fetch -p
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

      - name: Build and Deploy Containers
        uses: appleboy/ssh-action@b0a8f324e192469585a608d1f586061cf28a6571
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd  ${{ secrets.APP_PATH }}
            echo "Disk before cleanup:"
            df -h /
            docker system df || true
            # The publish step fails with "No space left on device" when old images and
            # build cache are still on the host. Remove those before building. Do not
            # prune volumes: Postgres and object storage data live there.
            docker container prune -f || true
            docker image prune -af || true
            docker buildx prune -af || true
            docker builder prune -af || true
            echo "Disk after cleanup:"
            df -h /
            # One service at a time. Publishing api and workers together filled the disk.
            docker compose -f docker-compose.yml --profile=app build api
            docker compose -f docker-compose.yml --profile=app build workers
            docker compose -f docker-compose.yml --profile=app build studio
            docker compose -f docker-compose.yml --profile=app up -d --no-build
            docker image prune -f || true
            # Probe over the compose network: the host API port may not be published.
            # Studio (nginx) ships wget; the API applies migrations before listening.
            for attempt in $(seq 1 36); do
              if docker compose -f docker-compose.yml exec -T studio \
                wget -qO- http://api:8080/health/ready >/dev/null 2>&1; then
                exit 0
              fi
              sleep 5
            done
            echo "API did not become ready after migrate/startup" >&2
            docker compose -f docker-compose.yml ps >&2 || true
            docker compose -f docker-compose.yml logs --tail=160 api object-storage >&2 || true
            exit 1
