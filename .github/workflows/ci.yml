name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: devweave
          POSTGRES_USER: devweave
          POSTGRES_PASSWORD: change-me-locally
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U devweave -d devweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DevWeave.sln

      - name: Build
        run: dotnet build DevWeave.sln --no-restore --configuration Release

      - name: Test
        env:
          DEVWEAVE_TEST_DB_HOST: localhost
          DEVWEAVE_TEST_DB_PORT: '5433'
          DEVWEAVE_TEST_DB_USER: devweave
          DEVWEAVE_TEST_DB_PASSWORD: change-me-locally
        run: dotnet test DevWeave.sln --no-build --configuration Release --logger "trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/studio
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
