# Local DevWeave stack.
#   Dependencies only:   docker compose up -d postgres object-storage
#   Full stack:          docker compose --profile app up -d --build   (Studio on :8081, API on :5080; override host ports via .env)
# Development scaffolding only; production topology is defined in infra/.

name: devweave

services:
  postgres:
    image: postgres:18-alpine
    container_name: devweave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devweave}
      POSTGRES_USER: ${POSTGRES_USER:-devweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - devweave-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devweave} -d ${POSTGRES_DB:-devweave}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage stand-in for artifact binaries (SRS 3.1, 7.1).
  object-storage:
    image: ${OBJECT_STORAGE_IMAGE:-quay.io/minio/aistor/minio:latest}
    container_name: devweave-object-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE__ACCESSKEY:-devweave}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE__SECRETKEY:-change-me-locally}
    ports:
      - "${OBJECT_STORAGE_PORT:-9000}:9000"
      - "${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - devweave-object-storage-data:/data 

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/DevWeave.Api/Dockerfile
    container_name: devweave-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy } 
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DevWeave: Host=postgres;Port=5432;Database=${POSTGRES_DB:-devweave};Username=${POSTGRES_USER:-devweave};Password=${POSTGRES_PASSWORD:-change-me-locally}
      ObjectStorage__Endpoint: http://object-storage:9000
      ObjectStorage__Bucket: ${OBJECT_STORAGE__BUCKET:-devweave-artifacts}
      Auth__SigningKey: ${Auth__SigningKey:-devweave-local-dev-signing-key-change-in-production-0123456789}
      Auth__Oidc__Authority: ${OIDC__AUTHORITY:-}
      Auth__Oidc__Audience: ${OIDC__AUDIENCE:-devweave-api}
    ports:
      - "${API_PORT:-5080}:8080"

  workers:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/DevWeave.Workers/Dockerfile
    container_name: devweave-workers
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy } 
    environment:
      ConnectionStrings__DevWeave: Host=postgres;Port=5432;Database=${POSTGRES_DB:-devweave};Username=${POSTGRES_USER:-devweave};Password=${POSTGRES_PASSWORD:-change-me-locally}
      ObjectStorage__Endpoint: http://object-storage:9000
      ObjectStorage__Bucket: ${OBJECT_STORAGE__BUCKET:-devweave-artifacts}
      Auth__SigningKey: ${Auth__SigningKey:-devweave-local-dev-signing-key-change-in-production-0123456789}

  studio:
    profiles: ["app"]
    build:
      context: web/studio
    container_name: devweave-studio
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${STUDIO_PORT:-8081}:80"

volumes:
  devweave-postgres-data:
  devweave-object-storage-data:
