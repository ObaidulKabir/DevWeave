# Local development dependencies for DevWeave.
# Start with: docker compose up -d
# These services are development scaffolding only; production topology is defined in infra/.

name: devweave

services:
  postgres:
    image: postgres:18-alpine
    container_name: devweave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devweave}
      POSTGRES_USER: ${POSTGRES_USER:-devweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devweave-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devweave} -d ${POSTGRES_DB:-devweave}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage stand-in for artifact binaries (SRS 3.1, 7.1).
  object-storage:
    image: minio/minio:latest
    container_name: devweave-object-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE__ACCESSKEY:-devweave}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE__SECRETKEY:-change-me-locally}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - devweave-object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devweave-postgres-data:
  devweave-object-storage-data:
